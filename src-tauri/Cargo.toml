[package]
name = "cotenk"
version = "0.1.0"
description = "CoTenk — an open workspace for people and AI agents"
edition = "2021"
license = "MIT"
repository = "https://github.com/alexn236/cotenk"
rust-version = "1.77"

[lib]
name = "cotenk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
notify = "8.2.0"
base64 = "0.22"

[profile.release]
opt-level = 2
incremental = true
