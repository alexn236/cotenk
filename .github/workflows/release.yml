# Builds the desktop app for Windows, macOS and Linux and publishes it as
# a GitHub release v<version> — run it from the Actions tab ("Run
# workflow") or push a version tag (git tag v0.2.0 && git push origin
# v0.2.0). The installers are collected on a draft first; once every
# platform built, the last job publishes the release.
#
# The app version comes from src-tauri/tauri.conf.json — bump it there
# (and in package.json / src-tauri/Cargo.toml) before releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: CoTenk ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Local-first workspace for you and your AI agents (Claude Code, Devin CLI).

            **Download**
            - Windows: `CoTenk_*_x64-setup.exe`
            - macOS: `CoTenk_*_aarch64.dmg` (Apple Silicon) or `CoTenk_*_x64.dmg` (Intel)
            - Linux: `.AppImage` or `.deb`

            The builds are not code-signed with a paid certificate yet. Windows: SmartScreen may warn, click "More info → Run anyway". macOS: open the app once, then System Settings → Privacy & Security → "Open Anyway". If macOS says the app is damaged, run `xattr -cr /Applications/CoTenk.app` in Terminal.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --draft=false --latest
